name: CI

on:
  workflow_dispatch:

jobs:
  build-test:
    name: ubuntu-latest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install Python package and test dependencies
        run: python3 -m pip install -e ".[dev]"

      - name: Tool versions
        run: |
          python3 --version
          python3 -m pytest --version
          node --version
          npm --version

      - name: Python tests
        run: |
          python3 -m compileall aetherflow bridge_service eps_emulator compat/python tests/python
          python3 -m pytest

      - name: Compatibility vectors
        run: python3 compat/python/check_vectors.py compat/vectors/aetherflow_can_vectors.json

      - name: Dashboard dependencies
        run: npm ci --prefix openmct

      - name: Dashboard build
        run: npm --prefix openmct run build
